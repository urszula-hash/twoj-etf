}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#111111; --fg:#ffffff; --line:#ffffff; --fill:#2a2a2a; --soft:#1c1c1c;

:root[data-theme="dark"]{ --bg:#111111; --fg:#ffffff; --line:#ffffff; --fill:#2a2a2a; --soft:#1c1c1c;

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px;min-height:100svh;display:flex;flex-direction:column}
h1{font-size:30px;font-weight:800;line-height:1.1;margin:8px 0 14px;letter-spacing:-.01em}
h2{font-size:23px;font-weight:800;line-height:1.2;margin:4px 0 14px}
p{margin:0 0 12px}
.card{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 12px;background:transparent}
.card h3{font-size:17px;font-weight:600;margin:0 0 6px}
.card.fill{background:var(--fill)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px;font-size:14px}
.steps{display:flex;gap:5px;flex:1}
.steps i{flex:1;height:6px;border-radius:3px;border:1px solid var(--line);background:transparent}
.steps i.on{background:var(--fg)}
.btn{display:block;width:100%;text-align:left;font:inherit;color:var(--fg);background:transparent;
  border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 10px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:background .15s}
.btn b{display:block;font-weight:600;margin-bottom:2px}
.btn span{display:block;font-size:15px}
.btn:active,.btn:hover{background:var(--fill)}
.btn.main{background:var(--fill);text-align:center;font-weight:600}
.link{background:none;border:none;color:var(--fg);font:inherit;font-size:15px;text-decoration:underline;padding:8px 0;cursor:pointer}
.small{font-size:14px}
.tag{display:inline-block;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;font-size:14px;margin:0 6px 6px 0}
.profile{display:flex;align-items:center;gap:14px}
.badge{flex:none;width:58px;height:58px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:800;color:#fff}
.name{font-size:21px;font-weight:800;line-height:1.25;margin:4px 0 12px}
.part{display:block;padding:7px 0;border-top:1px solid var(--fill)}
.part:first-child{border-top:none}
.part em{font-style:normal;font-weight:600}
ul{margin:0;padding-left:20px}
li{margin:0 0 6px}
.bars{display:grid;grid-template-columns:96px 1fr 52px;gap:8px 10px;align-items:center;font-size:15px}
.bar{height:22px;border:1.5px solid var(--line);border-radius:6px;transition:width .5s ease}
.bar.g{background:var(--fill)}
.num{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px}
.row .btn{text-align:center}
.disc{font-size:13px;margin-top:auto;padding-top:18px}
.fade{animation:f .25s ease}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* tryb sali (rzutnik) */
.sala main{max-width:1200px}
.sala h1{font-size:46px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.sala .card{font-size:20px}
</style>
</head>

    ['Tylko kraje rozwinięte','bez rynków wschodzących', s=>{s.region='dev'; s.why.push(['Kraje rozwinięte','Indeks bez rynków wschodzących, np. bez Chin, Indii, Brazylii; mimo to dominują w nim spółki z USA.']); return 'lewar';}],
    ['Tylko USA','największy rynek akcji', s=>{s.region='us'; s.why.push(['USA','S&P 500: 500 dużych spółek; większa koncentracja w jednym kraju.']); return 'lewar';}],
    ['Tylko Polska','znam te spółki', s=>{s.region='pl'; s.why.push(['Polska','WIG20TR: 20 spółek, bardzo mała dywersyfikacja, duży udział banków i energetyki.']); return 'lewar';}]]},
  lewar:{t:'Kusi Cię ETF lewarowany 2×, żeby zarabiać dwa razy szybciej?', h:'ETF lewarowany', a:[
    ['Tak, biorę 2×','podwójny zysk brzmi świetnie', s=>'DEMO'],
    ['Nie, zostaję przy zwykłym ETF','', s=>{s.why.push(['Bez lewara','Cel „2×” dotyczy jednego dnia; przy długim horyzoncie wynik może mocno odbiegać od 2 × indeks.']); return s.region==='pl'?'R:pl':'waluta';}]]},
  waluta:{t:'Akcje z zagranicy są wyceniane w obcej walucie. Co z kursem złotego?', h:'Ryzyko walutowe', a:[
    ['Akceptuję ryzyko walutowe','kurs może pomóc albo zaszkodzić', s=>{s.why.push(['Bez zabezpieczenia walutowego','Wynik w złotych zależy od stopy zwrotu w walucie aktywów i od zmiany kursu.']); return s.region==='tech'?'R:tech':'dochody';}],
    ['Chcę zabezpieczenia do złotego','liczy się wynik w PLN', s=>{
      if(s.region==='all'){ s.region='dev'; s.why.push(['Zabezpieczenie walutowe','W przykładach z tej aplikacji zabezpieczony do złotego jest fundusz na kraje rozwinięte, więc zamieniamy „cały świat” na „kraje rozwinięte”.']); }
      else s.why.push(['Zabezpieczenie walutowe','Fundusz zawiera transakcje terminowe na walutę; nie jest to bezpłatne ani doskonałe.']);
      return s.region==='us'?'R:usHedged':s.region==='tech'?'R:techHedged':'R:devHedged';}]]},
  dochody:{t:'Co ma się dziać z dywidendami?', h:'Akumulujący czy dystrybucyjny', a:[
    ['Niech pracują dalej','fundusz je reinwestuje', s=>{s.why.push(['Akumulujący','Dywidendy zwiększają wartość aktywów netto na jednostkę, nie trafiają na Twoje konto.']); return 'R:'+s.region+'Acc';}],
    ['Chcę je dostawać','wypłata na rachunek', s=>{s.why.push(['Dystrybucyjny','Fundusz okresowo wypłaca dochody; w dniu ustalenia prawa do wypłaty WAN na jednostkę spada o kwotę wypłaty.']); return 'R:'+s.region+'Dist';}]]}
};
const ORDER = ['horyzont','spadek','temat','region','lewar','waluta','dochody'];

/* ================== STAN I WIDOKI ================== */
let S;
const app = document.getElementById('app');
const esc = t => String(t).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function reset(){ S={why:[],region:null,hist:[]}; }
function render(html){ app.innerHTML='<div class="fade">'+html+'</div>'; window.scrollTo(0,0); }
const DISC = '<p class="disc">Aplikacja ma cel wyłącznie edukacyjny na potrzeby wykładu „Rynki finansowe”. Nie jest rekomendacją inwestycyjną ani doradztwem. Fundusze podano jako przykłady; przed decyzją przeczytaj dokument KID.<br>Wersja 3</p>';

function start(){
  reset();
  render(`
    <h1>Twój ETF</h1>
    <div class="card"><p>Odpowiesz na kilka pytań, a aplikacja dobierze przykładowy ETF i pokaże, jak czytać jego nazwę.</p>
    <p style="margin:0">Na końcu dostaniesz numer profilu. Zapamiętaj go: sprawdzimy, jak rozkładają się wyniki na sali.</p></div>
    <button class="btn main" onclick="ask('horyzont')">Zaczynam</button>
    ${DISC}`);
}

function ask(id){
  const q = Q[id], idx = ORDER.indexOf(id);
  S.hist.push(id);
  render(`
    <p class="small" style="margin:6px 0 2px">Pytanie ${S.hist.length} · ${q.h}</p>
    <h2>${q.t}</h2>
    ${q.a.map((a,i)=>`<button class="btn" onclick="pick('${id}',${i})"><b>${a[0]}</b>${a[1]?`<span>${a[1]}</span>`:''}</button>`).join('')}
    ${S.hist.length>1?'<button class="link" onclick="back()">← Wstecz</button>':''}
  `);
}
function back(){ S.hist.pop(); const prev=S.hist.pop(); S.why.pop(); ask(prev); }

function pick(id,i){
  const next = Q[id].a[i][2](S);
  if(next==='DEMO') return demo(0);
  if(next.startsWith('R:')) return result(next.slice(2));
  ask(next);
}

/* --- ETF lewarowany: 100 → 110 → 99 vs 100 → 120 → 96 --- */
function demo(day){
  const idx=[100,110,99], lev=[100,120,96];
  const w=v=>Math.round(v/130*100);
  const lbl=['Start','Dzień 1: indeks +10%','Dzień 2: indeks −10%'][day];
  const txt=[
    'Masz 100 zł w zwykłym ETF na indeks i 100 zł w ETF lewarowanym 2×. Zobaczmy dwa dni.',
    'Indeks rośnie o 10%. ETF 2× rośnie o 20%: ma 120 zł. Na razie wygląda świetnie.',
    'Indeks spada o 10%. ETF 2× spada o 20%, ale liczone od 120 zł, czyli o 24 zł.'][day];
  render(`
    <p class="small" style="margin:6px 0 2px">ETF lewarowany</p>
    <h2>Sprawdźmy na liczbach</h2>
    <div class="card">
      <p style="font-weight:600">${lbl}</p>
      <div class="bars">
        <span>ETF na indeks</span><div><div class="bar" style="width:${w(idx[day])}%"></div></div><span class="num">${idx[day]} zł</span>
        <span>ETF 2×</span><div><div class="bar g" style="width:${w(lev[day])}%"></div></div><span class="num">${lev[day]} zł</span>
      </div>
      <p style="margin:12px 0 0">${txt}</p>
    </div>
    ${day<2?`<button class="btn main" onclick="demo(${day+1})">Następny dzień</button>`:`
    <div class="card fill"><p><b>Wynik:</b> indeks −1%, ETF 2× −4%, a nie −2%.</p>
    <p style="margin:0">Cel „2×” dotyczy jednego dnia. Spadek trafił na większą ekspozycję (120 zł), bo dzień wcześniej fundusz urósł. To produkt krótkoterminowy, nie na lata.</p></div>
    <button class="btn main" onclick="afterDemo()">Rozumiem, wracam do zwykłego ETF</button>`}
  `);
}
function afterDemo(){
  S.why.push(['Bez lewara (po namyśle)','ETF 2× przy wahaniach w górę i w dół traci więcej niż 2 × indeks; przy długim horyzoncie to zły wybór.']);
  S.lever=true;
  if(S.region==='pl') return result('pl');
  ask('waluta');
}

function result(key){
  const f=FUNDS[key], col=COLORS[f.nr];
  wyslijProfil(f);
  const nm=f.parts.map((p,i)=>`<span style="color:${COL[i%6]}">${esc(p[0])}</span>`).join(' ');
  const parts=f.parts.map((p,i)=>`<span class="part"><em style="color:${COL[i%6]}">${esc(p[0])}</em> · ${esc(p[1])}<br><span class="small">${esc(p[2])}</span></span>`).join('');
  const form = {UCITS:'Fundusz UCITS z siedzibą w Irlandii, notowany na giełdach europejskich. Tytuły uczestnictwa kupujesz na giełdzie przez dom maklerski.',
    FIZ:'Polski ETF w formie funduszu inwestycyjnego zamkniętego, notowany na GPW. Kupujesz certyfikaty inwestycyjne przez dom maklerski.',
    ETC:'Exchange traded commodity: papier dłużny emitenta notowany na giełdzie. Kupujesz go przez dom maklerski jak ETF, ale to nie jest fundusz.'}[f.typ];
  render(`
    <p class="small" style="margin:6px 0 8px">Twój wynik</p>
    <div class="card profile"><div class="badge" style="background:${col}">${f.nr}</div>
      <div><div class="small">Profil ${f.nr}</div><div style="font-weight:800;font-size:19px;line-height:1.2">${esc(f.profil)}</div></div></div>
    ${SHORT[key]?`<div class="card fill"><h3>Dlaczego bez dalszych pytań</h3><p style="margin:0">${SHORT[key]}</p></div>`:''}
    <div class="card"><h3>${f.typ==='ETC'?'Przykładowy instrument':'Przykładowy ETF'}</h3>
      <div class="name">${nm}</div>
      ${f.isin?`<span class="tag">ISIN ${f.isin}</span>`:''}<span class="tag">${{UCITS:'UCITS',FIZ:'FIZ, GPW',ETC:'ETC, nie ETF'}[f.typ]}</span>
      <p class="small" style="margin:6px 0 0">${form}</p></div>
    <div class="card"><h3>Jak czytać tę nazwę</h3>${parts}</div>
    ${f.extra?`<div class="card"><h3>Warto wiedzieć</h3><p style="margin:0">${f.extra}</p></div>`:''}
    <div class="card"><h3>Dlaczego ten fundusz</h3><ul>${S.why.map(w=>`<li><b style="font-weight:600">${esc(w[0])}.</b> ${esc(w[1])}</li>`).join('')}</ul></div>
    <div class="card fill"><h3>Zanim kupisz cokolwiek naprawdę</h3>
      <p style="margin:0">Porównaj koszty (TER), różnicę odwzorowania, wielkość funduszu i sposób replikacji. Te same pytania mogą prowadzić do innych funduszy na ten sam indeks.</p></div>
    <button class="btn main" onclick="start()">Zacznij od nowa</button>
    ${DISC}`);
}

/* --- Tryb sali: ?sala w adresie, na rzutnik --- */
function sala(){
  document.body.classList.add('sala');
  const items=Object.values(FUNDS).sort((a,b)=>a.nr-b.nr).map(f=>`
    <div class="card profile"><div class="badge" style="background:${COLORS[f.nr]}">${f.nr}</div>
    <div><div style="font-weight:800">${esc(f.profil)}</div><div class="small" style="font-size:16px">${esc(fullName(f))}</div></div></div>`).join('');
  render(`<h1>Twój ETF: profile na sali</h1>
    <p style="font-size:22px">Podnieś rękę, gdy usłyszysz numer swojego profilu.</p>
    <div class="grid">${items}</div>
    <p class="disc" style="font-size:16px">Cel edukacyjny, nie rekomendacja inwestycyjna.</p>`);
}

if(new URLSearchParams(location.search).has('sala')) sala(); else start();
</script>
</body>
</html>
